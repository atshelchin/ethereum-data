# Cloudflare Workers deployment.
# Static files are served by Workers Static Assets (no Worker invocations);
# only /api/* hits the WASM Worker compiled from rust/worker.
#
# Note: this repo has ~29k static files, which exceeds the free plan's
# 20,000-asset limit — a Workers paid plan and wrangler >= 4.34 are required.
#
# Deploy: `bun run build` (generates index/ and erc7730/), then `wrangler deploy`.
#
# The compiled Worker (rust/worker/build/) is committed to the repo so that
# deploys — including Cloudflare's git-connected Workers Builds — need no Rust
# toolchain. After editing rust/worker sources, run `bun run build:worker`
# and commit the regenerated artifacts.

name = "ethereum-data"
main = "rust/worker/build/worker/shim.mjs"
# Keep this <= the max date supported by the local wrangler's workerd,
# or `wrangler dev` fails to start.
compatibility_date = "2026-05-07"

[assets]
directory = "."
# Fall back to /index.html for unknown paths (same as the original Bun server)
not_found_handling = "single-page-application"
# Only /api/* invokes the Worker; everything else is served as static assets
run_worker_first = ["/api/*"]

# To bind a custom domain, uncomment and adjust:
# routes = [
#   { pattern = "ethereum-data.awesometools.dev", custom_domain = true }
# ]
