services:
  ethereum-data:
    # Builds locally; to use the CI-published image instead,
    # comment out `build` and keep `image`.
    build: .
    image: ghcr.io/atshelchin/ethereum-data:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    # The image ships with all data baked in. To serve the repo working tree
    # directly (edit data without rebuilding the image), uncomment:
    # volumes:
    #   - ./:/app/data:ro
